name: streamzw

# Local stack for StreamZW.
# Includes app services, data services, and object storage with bucket bootstrap.

services:
  postgres:
    image: postgres:16
    container_name: streamzw-postgres
    environment:
      POSTGRES_USER: streamzw
      POSTGRES_PASSWORD: streamzw
      POSTGRES_DB: streamzw
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U streamzw -d streamzw']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: streamzw-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Object storage: uses the host's existing RustFS instance at :9000 (S3-compatible).
  # Buckets streamzw-videos and streamzw-thumbs must exist — run infra/scripts/init-buckets.sh once.

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: streamzw-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://streamzw:streamzw@postgres:5432/streamzw
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${S3_SECRET_KEY:-admin1234}
      MINIO_BUCKET_VIDEOS: ${MINIO_BUCKET_VIDEOS:-streamzw-videos}
      MINIO_BUCKET_THUMBS: ${MINIO_BUCKET_THUMBS:-streamzw-thumbs}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_PRESIGN_TTL: ${MINIO_PRESIGN_TTL:-3600}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-replace-with-openssl-rand-hex-32}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-replace-with-openssl-rand-hex-32}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
    ports:
      - '3001:3001'

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:3001}
    container_name: streamzw-web
    depends_on:
      api:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:3001}
    ports:
      - '${WEB_HOST_PORT:-3040}:3030'

volumes:
  postgres-data:
  redis-data:
