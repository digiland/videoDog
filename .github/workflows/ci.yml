name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: streamzw
          POSTGRES_PASSWORD: streamzw
          POSTGRES_DB: streamzw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://streamzw:streamzw@localhost:5432/streamzw
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-32-bytes-minimum-length-x
      JWT_REFRESH_SECRET: ci-refresh-secret-32-bytes-minimum-length

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The transcoder tests run real ffmpeg (they skip if it's missing).
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - run: pnpm --filter api migrate

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

  # The production images build (Dockerfiles, ffmpeg in the API image). No push.
  images:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: NEXT_PUBLIC_API_BASE=https://api.example.com
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
